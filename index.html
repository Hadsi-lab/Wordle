<style>
/* Layout: one-screen app. Header, then a board that fills the free height, then a thumb-reach keyboard. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #17202e;
  --muted: #5b6678;
  --line: #d3d9e3;
  --key: #dde2ea;
  --key-ink: #17202e;
  --accent: #3554d1;
  --accent-ink: #ffffff;
  --hit: #2e9b67;
  --near: #d29d16;
  --miss: #7b8698;
  --tile-ink: #ffffff;
  --danger: #c2413a;
  --shadow: 0 10px 40px rgba(23, 32, 46, .18);
  --p1: #3554d1; --p2: #c2413a; --p3: #2e9b67; --p4: #9b4fd1; --p5: #d27a16; --p6: #1f8ea8;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --tile: 58px;
  --gap: 6px;
  --radius: 10px;
  color-scheme: light;
}
:root.contrast { --hit: #e9701c; --near: #3b8fe0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #1b212b; --ink: #e9eef6; --muted: #9ba6b7; --line: #2e3745;
    --key: #5a6375; --key-ink: #eef2f8; --accent: #7d97ff; --accent-ink: #0e1320;
    --hit: #3aa874; --near: #cf9f22; --miss: #323946; --danger: #ef6b62;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  :root.contrast:not([data-theme="light"]) { --hit: #f08030; --near: #4a9ff0; }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #1b212b; --ink: #e9eef6; --muted: #9ba6b7; --line: #2e3745;
  --key: #5a6375; --key-ink: #eef2f8; --accent: #7d97ff; --accent-ink: #0e1320;
  --hit: #3aa874; --near: #cf9f22; --miss: #323946; --danger: #ef6b62;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
:root.contrast[data-theme="dark"] { --hit: #f08030; --near: #4a9ff0; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%; display: flex; flex-direction: column;
  max-width: 560px; margin: 0 auto;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Header */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-block: 8px 4px; }
.top .left, .top .right { display: flex; gap: 2px; align-items: center; }
.top .right { justify-content: flex-end; }
.brand { text-align: center; line-height: 1.05; min-width: 0; }
.brand h1 { margin: 0; font: 800 clamp(22px, 6vw, 28px)/1 var(--font-display); letter-spacing: -.02em; }
.brand h1 span { color: var(--accent); }
.brand .meta { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.icon-btn {
  width: 38px; height: 40px; border: 0; border-radius: 12px; background: transparent; flex: none;
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:active { background: var(--key); }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.who {
  display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 3px; cursor: pointer; max-width: 130px; min-width: 0;
}
.who .nm { display: none; }
@media (min-width: 460px) { .who { padding-right: 10px; } .who .nm { display: block; } }
.who .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  color: #fff; font: 800 14px/1 var(--font-display); background: var(--p1);
}

/* Board */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative; }
.hintstrip { display: flex; gap: var(--gap); min-height: 0; }
.hintstrip[hidden] { display: none !important; }
.hintstrip div {
  width: var(--tile); height: calc(var(--tile) * .42); border-radius: 6px;
  display: grid; place-items: center; font: 700 calc(var(--tile) * .26)/1 var(--font-display);
  color: var(--hit); border: 1.5px dashed var(--line);
}
.hintstrip div.on { border-color: var(--hit); }
.board { display: grid; gap: var(--gap); }
.row { display: grid; grid-template-columns: repeat(var(--cols), var(--tile)); gap: var(--gap); }
.tile {
  width: var(--tile); height: var(--tile); border-radius: var(--radius);
  border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; text-transform: uppercase;
  font: 800 calc(var(--tile) * .52)/1 var(--font-display); user-select: none;
  perspective: 400px;
}
.tile.filled { border-color: var(--muted); animation: pop .1s ease-out; }
.tile.hit, .tile.near, .tile.miss { color: var(--tile-ink); border-color: transparent; }
.tile.hit { background: var(--hit); }
.tile.near { background: var(--near); }
.tile.miss { background: var(--miss); }
.tile.flip { animation: flip .5s ease-in-out both; }
.row.shake { animation: shake .45s; }
.tile.dance { animation: dance .5s ease-in-out both; }
.row.current .tile { cursor: pointer; }
.tile.cursor { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.tile.filled.cursor { border-color: var(--accent); }
@keyframes pop { 50% { transform: scale(1.1); } }
@keyframes flip {
  0% { transform: rotateX(0); background: var(--surface); color: var(--ink); border-color: var(--muted); }
  49% { transform: rotateX(90deg); background: var(--surface); color: var(--ink); border-color: var(--muted); }
  51% { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}
@keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(4px); } 30%,50%,70% { transform: translateX(-7px); } 40%,60% { transform: translateX(7px); } }
@keyframes dance { 20% { transform: translateY(-40%); } 40% { transform: translateY(5%); } 60% { transform: translateY(-12%); } 80% { transform: translateY(2%); } }

/* Toast */
.toasts { position: absolute; top: 4px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 5; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: 92%; text-align: center; animation: toastin .15s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translateY(-6px); } }

/* Action bar */
.actions { display: flex; justify-content: center; gap: 8px; padding-block: 4px 6px; min-height: 40px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chip:disabled { opacity: .45; cursor: default; }
.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* Keyboard */
.kb { display: flex; flex-direction: column; gap: 7px; padding-block: 2px 8px; user-select: none; touch-action: manipulation; }
.kb .r { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1 1 0; max-width: 48px; height: clamp(46px, 7.4vh, 58px); border: 0; border-radius: 8px;
  background: var(--key); color: var(--key-ink); font: 700 clamp(15px, 4.4vw, 19px)/1 var(--font-body);
  text-transform: uppercase; cursor: pointer; display: grid; place-items: center; padding: 0;
  transition: background-color .2s;
}
.key.wide { flex: 1.55 1 0; max-width: 74px; font-size: 12.5px; letter-spacing: .04em; }
.key svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.key:active { filter: brightness(.88); }
.key.hit { background: var(--hit); color: var(--tile-ink); }
.key.near { background: var(--near); color: var(--tile-ink); }
.key.miss { background: var(--miss); color: var(--tile-ink); }
.kb .spacer { flex: .5 1 0; max-width: 24px; }

/* Dialogs */
dialog {
  border: 0; padding: 0; background: var(--surface); color: var(--ink);
  border-radius: 18px; box-shadow: var(--shadow);
  width: min(520px, calc(100% - 24px)); max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: hidden;
}
dialog::backdrop { background: rgba(10, 14, 22, .55); }
dialog:focus { outline: none; }
dialog[open] { display: flex; flex-direction: column; animation: dlgin .18s ease-out; }
@keyframes dlgin { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 6px 20px; }
.dlg-head h2 { margin: 0; font: 800 22px/1.1 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.dlg-body { flex: 1 1 auto; min-height: 0; min-width: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.dlg-body p { margin: 0; }
.sec h3 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.seg { display: flex; background: var(--key); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 8px 4px; font-weight: 600; cursor: pointer; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt .t { font-weight: 600; }
.opt .d { font-size: 12.5px; color: var(--muted); }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--key); border-radius: 999px; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + span { background: var(--hit); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--key); color: var(--key-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }

.example { display: flex; gap: 5px; margin: 6px 0 4px; }
.example .tile { --tile: 40px; width: 40px; height: 40px; font-size: 21px; border-radius: 8px; }

.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.statgrid b { display: block; font: 800 28px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.statgrid span { font-size: 11.5px; color: var(--muted); line-height: 1.2; display: block; }
.dist { display: flex; flex-direction: column; gap: 4px; }
.dist .bar { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }
.dist .fill { background: var(--miss); color: #fff; border-radius: 4px; padding: 2px 8px; text-align: right; min-width: 26px; width: max(26px, var(--w)); }
.dist .fill.now { background: var(--hit); }
table.fam { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.fam th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: right; font-weight: 700; padding: 4px 4px 6px; }
table.fam th:first-child, table.fam td:first-child { text-align: left; }
table.fam td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: right; }
table.fam .pn { display: flex; align-items: center; gap: 8px; font-weight: 600; }
table.fam .pn .badge { width: 24px; height: 24px; font-size: 12px; }
.hist { display: flex; flex-direction: column; }
.hist button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 2px; cursor: pointer; }
.hist .w { font: 800 17px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.hist .r { font-weight: 700; font-variant-numeric: tabular-nums; }
.hist .r.lost { color: var(--danger); }
.hist .s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 6px; padding: 0 20px 4px; }

.result-word { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.result-word .tile { --tile: 44px; width: 44px; height: 44px; font-size: 24px; }
.result-msg { text-align: center; font: 800 26px/1.1 var(--font-display); margin: 0; }
.meaning { background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.meaning .pos { font-style: italic; color: var(--muted); margin-right: 4px; }
.meaning ol { margin: 4px 0 0; padding-left: 20px; }
.meaning a { color: var(--accent); font-weight: 600; }
.code {
  font: 800 28px/1 var(--font-display); letter-spacing: .14em; text-align: center; padding: 14px; border-radius: 12px;
  background: var(--bg); user-select: all; word-break: break-all;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field input {
  font: 600 18px/1.2 var(--font-body); padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; text-transform: uppercase; letter-spacing: .08em;
}
.field input.name { text-transform: none; letter-spacing: 0; }
.err { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 1em; }
.players { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1.5px solid var(--line); border-radius: 14px; }
.prow.active { border-color: var(--accent); }
.prow input { flex: 1; min-width: 0; border: 0; background: transparent; font: 600 16px var(--font-body); color: var(--ink); padding: 6px 4px; border-radius: 6px; }
.prow .sm { font-size: 12px; color: var(--muted); white-space: nowrap; }
.colors { display: flex; gap: 6px; }
.colors button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.colors button[aria-pressed="true"] { border-color: var(--ink); }
.confirm { background: var(--bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.hint-opts { display: flex; flex-direction: column; gap: 8px; }
.hint-opts .btn { justify-content: flex-start; text-align: left; }
.hint-opts .btn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.clue { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
ul.tight { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
[hidden] { display: none !important; }

/* Mode switch */
.modes { display: flex; justify-content: center; padding-block: 0 4px; }
.modes .seg { width: min(260px, 100%); }
.modes .seg button { padding: 6px 4px; font-size: 13.5px; }

/* Hangman */
.hang { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-block: 4px; }
.hang svg { flex: 1 1 auto; min-height: 110px; max-height: 300px; width: 100%; overflow: visible; }
.hang svg.shake { animation: shake .45s; }
.hp { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; opacity: 0; }
.hp.gallows { stroke: var(--muted); }
.hp.on { opacity: 1; }
.hp.fresh { animation: draw .45s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.hang svg.lost .hp.man { stroke: var(--danger); }
.hang svg.won .hp.man { stroke: var(--hit); }
.face { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.hang svg.lost .face { stroke: var(--danger); }
.hang svg.won .face { stroke: var(--hit); }
.hang-info { font-weight: 700; color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.lives { display: flex; gap: 4px; }
.lives i { width: 10px; height: 10px; border-radius: 50%; background: var(--hit); }
.lives i.gone { background: var(--line); }
.hang-word { display: flex; gap: 6px; justify-content: center; }
.hang-word .slot {
  width: var(--slot, 44px); height: calc(var(--slot, 44px) * 1.15); border-bottom: 4px solid var(--ink);
  display: grid; place-items: center; text-transform: uppercase;
  font: 800 calc(var(--slot, 44px) * .7)/1 var(--font-display);
}
.hang-word .slot.got { animation: pop .15s ease-out; }
.hang-word .slot.hinted { color: var(--hit); }
.hang-word .slot.missed { color: var(--danger); }
.hang-wrong { min-height: 1.4em; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; font-size: 15px; text-align: center; }
.hang-wrong span { letter-spacing: 0; text-transform: none; font-weight: 600; margin-right: 6px; }
.key:disabled { cursor: default; }

.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 600; }

@media (max-height: 640px) { .key { height: 44px; } .kb { gap: 5px; } .top { padding-block: 4px 2px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition: none !important; }
}
</style>

<body>
<!--ARTIFACT:RESUME-->
<div class="app" id="app">
  <header class="top">
    <div class="left">
      <button class="icon-btn" id="btnHelp" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 3.9"/><path d="M12 17.3h.01"/></svg></button>
      <button class="who" id="btnWho" aria-label="Change player"><span class="badge" id="whoBadge">P</span><span class="nm" id="whoName">Player</span></button>
    </div>
    <div class="brand">
      <h1>Hadsi <span>Words</span></h1>
      <div class="meta" id="meta">&nbsp;</div>
    </div>
    <div class="right">
      <button class="icon-btn" id="btnNew" aria-label="New word"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="icon-btn" id="btnStats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
      <button class="icon-btn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
    </div>
  </header>

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- storage */
const LS_KEY = 'guesswork.v1';
const store = {
  get() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; } },
  set(v) { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch { /* private mode: play on without saving */ } }
};

const MAX_ROWS = 6;
const LENGTHS = [4, 5, 6, 7];
const LEVELS = ['easy', 'normal', 'tricky'];
const LEVEL_LABEL = { easy: 'Easy', normal: 'Normal', tricky: 'Tricky' };
const LEVEL_DESC = {
  easy: 'Everyday words a 10-year-old knows.',
  normal: 'Common words, like the classic game.',
  tricky: 'Adds less common words for word nerds.'
};
const COLORS = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'];
const WIN_MSG = ['Unreal!', 'Brilliant!', 'Superb!', 'Nicely done!', 'Got it!', 'Phew, just in time!', 'Phew, just in time!'];

const uid = () => Math.random().toString(36).slice(2, 10);
const newStats = () => ({ played: 0, won: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0], totalGuesses: 0, bestTime: 0, hints: 0 });
const newPlayer = (name, color) => ({
  id: uid(), name, color,
  prefs: { length: 5, level: 'normal', hard: false, hints: true, timer: true },
  stats: {}, history: [], seen: {}, game: null
});

let DB = store.get();
if (!DB || !DB.players || !DB.players.length) {
  DB = { v: 1, settings: { theme: 'auto', contrast: false, vibrate: true, enterRight: false }, players: [newPlayer('Player 1', 'p1')], active: null, seenHelp: false };
  DB.active = DB.players[0].id;
}
const save = () => store.set(DB);
const P = () => DB.players.find(p => p.id === DB.active) || DB.players[0];
const statsFor = (p, len) => (p.stats[len] ||= newStats());

/* ------------------------------------------------------------------ words */
const W = { answers: {}, valid: {}, ready: false };
async function loadWords() {
  const res = await fetch('words.json', { cache: 'force-cache' });
  const data = await res.json();
  const split = (s, n) => s.match(new RegExp('.{' + n + '}', 'g')) || [];
  for (const len of LENGTHS) {
    const tiers = data.a[len].map(s => split(s, len));
    W.answers[len] = tiers;
    W.valid[len] = new Set([...tiers.flat(), ...split(data.g[len], len)]);
  }
  W.ready = true;
}
function pool(len, level) {
  const t = W.answers[len];
  const n = LEVELS.indexOf(level) + 1;
  return t.slice(0, n).flat();
}
function randInt(n) {
  const a = new Uint32Array(1);
  (self.crypto || window.crypto).getRandomValues(a);
  return a[0] % n;
}
function pickWord(p, len, level) {
  const all = pool(len, level);
  const seen = new Set(p.seen[len] || []);
  let fresh = all.filter(w => !seen.has(w));
  if (fresh.length < 10) { p.seen[len] = []; fresh = all; }
  const w = fresh[randInt(fresh.length)];
  (p.seen[len] ||= []).push(w);
  return w;
}

/* ------------------------------------------------------------------ logic */
function score(guess, word) {
  const res = Array(word.length).fill('miss');
  const left = {};
  for (let i = 0; i < word.length; i++) {
    if (guess[i] === word[i]) res[i] = 'hit';
    else left[word[i]] = (left[word[i]] || 0) + 1;
  }
  for (let i = 0; i < word.length; i++) {
    if (res[i] === 'hit') continue;
    if (left[guess[i]] > 0) { res[i] = 'near'; left[guess[i]]--; }
  }
  return res;
}
const ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th'];
function hardModeProblem(guess, g) {
  const need = {};
  for (const prev of g.guesses) {
    const marks = score(prev, g.word);
    const count = {};
    for (let i = 0; i < prev.length; i++) {
      if (marks[i] === 'hit' && guess[i] !== prev[i]) return `${ORD[i]} letter must be ${prev[i].toUpperCase()}`;
      if (marks[i] !== 'miss') count[prev[i]] = (count[prev[i]] || 0) + 1;
    }
    for (const k in count) need[k] = Math.max(need[k] || 0, count[k]);
  }
  for (const k in need) {
    const have = [...guess].filter(c => c === k).length;
    if (have < need[k]) return `Guess must contain ${k.toUpperCase()}${need[k] > 1 ? ' twice' : ''}`;
  }
  return null;
}
// Challenge codes: a light scramble so the word isn't readable at a glance.
const A = 'abcdefghijklmnopqrstuvwxyz';
function encodeWord(w) {
  let sum = 0, out = '';
  for (let i = 0; i < w.length; i++) {
    const c = A.indexOf(w[i]); sum += c * (i + 1);
    out += A[(c + 11 + 7 * i) % 26];
  }
  return (out + A[sum % 26]).toUpperCase();
}
function decodeWord(code, anyWord = false) {
  code = (code || '').toLowerCase().replace(/[^a-z]/g, '');
  if (code.length < 5 || code.length > 13) return null;
  const body = code.slice(0, -1);
  let sum = 0, w = '';
  for (let i = 0; i < body.length; i++) {
    const c = ((A.indexOf(body[i]) - 11 - 7 * i) % 26 + 26) % 26;
    w += A[c]; sum += c * (i + 1);
  }
  if (A[sum % 26] !== code.at(-1)) return null;
  if (anyWord) return w;
  return W.valid[w.length]?.has(w) ? w : null;
}
const baseUrl = () => location.href.split('#')[0];
const fmtTime = ms => { const s = Math.round(ms / 1000); return s >= 3600 ? '59:59+' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------------------------------------------------------------- game state */
let busy = false;
// The row being typed: one slot per letter, plus the square the next letter goes into.
let slots = [];
let cur = 0;
const resetTyped = () => { slots = []; cur = 0; };
const filled = () => slots.filter(Boolean).length;
const $ = id => document.getElementById(id);

function newGame({ word = null, challenge = false } = {}) {
  const p = P();
  const len = word ? word.length : p.prefs.length;
  p.game = {
    word: word || pickWord(p, len, p.prefs.level),
    len, level: p.prefs.level, hard: p.prefs.hard, challenge,
    guesses: [], reveal: {}, ruled: [], clue: false, hints: 0,
    elapsed: 0, done: false, won: false, started: Date.now()
  };
  resetTyped();
  save();
  render();
}
const G = () => P().game;

/* timer */
let resumeAt = Date.now();
function bankTime() {
  const g = curGame();
  const started = g && (isHang() ? g.guessed.length > 0 : g.guesses.length + filled() > 0);
  if (g && !g.done && started && document.visibilityState === 'visible') g.elapsed += Date.now() - resumeAt;
  resumeAt = Date.now();
}
setInterval(() => { bankTime(); renderMeta(); }, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeAt = Date.now(); else { bankTime(); save(); } });

/* ------------------------------------------------------------------ render */
function applyTheme() {
  const s = DB.settings, root = document.documentElement;
  if (s.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = s.theme;
  root.classList.toggle('contrast', !!s.contrast);
}
function renderWho() {
  const p = P();
  $('whoBadge').textContent = (p.name.trim()[0] || '?').toUpperCase();
  $('whoBadge').style.background = `var(--${p.color})`;
  $('whoName').textContent = p.name;
}
function renderMeta() {
  const p = P();
  if (isHang()) {
    const h = HG(); if (!h) return;
    const bits = [`${h.lives} lives`, h.challenge ? 'Challenge' : LEVEL_LABEL[h.level]];
    if (p.prefs.timer) bits.push(fmtTime(h.elapsed));
    $('meta').textContent = bits.join(' · ');
    return;
  }
  const g = G(); if (!g) return;
  const bits = [`${g.len} letters`, g.challenge ? 'Challenge' : LEVEL_LABEL[g.level]];
  if (g.hard) bits.push('Hard');
  if (p.prefs.timer) bits.push(fmtTime(g.elapsed));
  $('meta').textContent = bits.join(' · ');
}
function sizeBoard() {
  if (isHang()) return sizeHang();
  const g = G(); if (!g) return;
  const stage = $('stage');
  const hintH = $('hintstrip').hidden ? 0 : 0.42 + 0.15;
  const gap = 6;
  const w = Math.min(stage.clientWidth - 8, 420);
  const h = stage.clientHeight - 12;
  const byW = (w - gap * (g.len - 1)) / g.len;
  const byH = (h - gap * (MAX_ROWS - 1) - 8) / (MAX_ROWS + hintH);
  const t = Math.max(30, Math.floor(Math.min(byW, byH, 66)));
  document.documentElement.style.setProperty('--tile', t + 'px');
}
function renderMode() {
  const hang = isHang();
  $('modes').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === (hang ? 'hangman' : 'words')));
  $('board').hidden = hang;
  $('hang').hidden = !hang;
  if (hang) $('hintstrip').hidden = true;
  $('btnNew').setAttribute('aria-label', hang ? 'New hangman word' : 'New word');
}
function render() {
  renderWho();
  renderMode();
  if (isHang()) {
    if (!HG()) return;
    renderHang(); renderKeyboard(); renderActions(); renderMeta();
    return;
  }
  const g = G();
  if (!g) return;
  const board = $('board');
  board.style.setProperty('--cols', g.len);
  board.innerHTML = '';
  for (let r = 0; r < MAX_ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row'; row.setAttribute('role', 'row');
    for (let c = 0; c < g.len; c++) {
      const t = document.createElement('div');
      t.className = 'tile'; t.setAttribute('role', 'gridcell');
      row.appendChild(t);
    }
    board.appendChild(row);
  }
  g.guesses.forEach((gw, r) => paintRow(r, gw, score(gw, g.word), false));
  paintTyping();
  renderHints();
  renderKeyboard();
  renderActions();
  renderMeta();
  sizeBoard();
}
function paintRow(r, word, marks, animate) {
  const row = $('board').children[r];
  [...row.children].forEach((t, i) => {
    t.textContent = word[i];
    const label = { hit: 'correct', near: 'in the word, wrong spot', miss: 'not in the word' }[marks[i]];
    t.setAttribute('aria-label', `${word[i].toUpperCase()}, ${label}`);
    if (animate) {
      t.style.animationDelay = (i * 260) + 'ms';
      t.classList.add('flip');
      setTimeout(() => { t.className = 'tile flip ' + marks[i]; }, i * 260 + 250);
    } else t.className = 'tile ' + marks[i];
  });
}
function paintTyping() {
  const g = G();
  if (g.done) return;
  const r = g.guesses.length;
  const row = $('board').children[r];
  if (!row) return;
  [...$('board').children].forEach(x => x.classList.remove('current'));
  row.classList.add('current');
  [...row.children].forEach((t, i) => {
    const ch = slots[i] || '';
    if (t.textContent !== ch) {
      t.textContent = ch;
      t.className = 'tile' + (ch ? ' filled' : '');
    }
    t.classList.toggle('cursor', i === cur);
    t.dataset.pos = i;
    t.setAttribute('aria-label', `Square ${i + 1}${ch ? ', ' + ch.toUpperCase() : ', empty'}. Tap to change.`);
  });
}
function renderHints() {
  const g = G();
  const strip = $('hintstrip');
  const keys = Object.keys(g.reveal);
  strip.hidden = !keys.length;
  strip.innerHTML = '';
  if (!keys.length) return;
  for (let i = 0; i < g.len; i++) {
    const d = document.createElement('div');
    if (g.reveal[i]) { d.textContent = g.reveal[i].toUpperCase(); d.className = 'on'; }
    strip.appendChild(d);
  }
}
const KB_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
function keyStates() {
  const g = G(), st = {};
  const rank = { miss: 1, near: 2, hit: 3 };
  g.guesses.forEach(gw => score(gw, g.word).forEach((m, i) => {
    const c = gw[i];
    if (!st[c] || rank[m] > rank[st[c]]) st[c] = m;
  }));
  g.ruled.forEach(c => { if (!st[c]) st[c] = 'miss'; });
  return st;
}
function renderKeyboard() {
  const kb = $('kb');
  if (isHang()) {
    const g = HG(); if (!g) return;
    kb.innerHTML = KB_ROWS.map((row, i) => {
      let keys = [...row].map(c => {
        const used = g.guessed.includes(c);
        const st = used ? (g.word.includes(c) ? 'hit' : 'miss') : '';
        return `<button class="key ${st}" data-k="${c}" ${used || g.done ? 'disabled' : ''} aria-label="${c.toUpperCase()}${used ? (st === 'hit' ? ', in word' : ', not in word') : ''}">${c}</button>`;
      }).join('');
      if (i) keys = '<span class="spacer"></span>' + keys + '<span class="spacer"></span>';
      return `<div class="r">${keys}</div>`;
    }).join('');
    return;
  }
  const st = keyStates();
  const enter = '<button class="key wide" data-k="enter" aria-label="Enter">Enter</button>';
  const back = '<button class="key wide" data-k="back" aria-label="Delete letter"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>';
  const swap = DB.settings.enterRight;
  kb.innerHTML = KB_ROWS.map((row, i) => {
    let keys = [...row].map(c => `<button class="key ${st[c] || ''}" data-k="${c}" aria-label="${c.toUpperCase()}${st[c] ? ', ' + ({ hit: 'correct', near: 'in word', miss: 'not in word' })[st[c]] : ''}">${c}</button>`).join('');
    if (i === 1) keys = '<span class="spacer"></span>' + keys + '<span class="spacer"></span>';
    if (i === 2) keys = (swap ? back : enter) + keys + (swap ? enter : back);
    return `<div class="r">${keys}</div>`;
  }).join('');
}
const ICON = {
  bulb: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  flag: '<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'
};
function renderActions() {
  if (isHang()) return renderHangActions();
  const g = G(), p = P(), el = $('actions');
  if (g.done) {
    el.innerHTML = `<button class="chip primary" id="aNext">${ICON.next}Next word</button><button class="chip" id="aResult">See result</button>`;
    $('aNext').onclick = () => newGame();
    $('aResult').onclick = () => openResult();
    return;
  }
  const parts = [];
  if (p.prefs.hints) parts.push(`<button class="chip" id="aHint">${ICON.bulb}Hint${g.hints ? ` (${g.hints})` : ''}</button>`);
  parts.push(`<button class="chip" id="aChallenge">${ICON.people}Challenge</button>`);
  if (g.guesses.length) parts.push(`<button class="chip" id="aGiveUp">${ICON.flag}Give up</button>`);
  el.innerHTML = parts.join('');
  $('aHint') && ($('aHint').onclick = openHints);
  $('aChallenge').onclick = openChallenge;
  $('aGiveUp') && ($('aGiveUp').onclick = confirmGiveUp);
}

/* ------------------------------------------------------------------ toasts */
function toast(msg, ms = 1600) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), ms);
}
const buzz = pattern => { if (DB.settings.vibrate && navigator.vibrate) try { navigator.vibrate(pattern); } catch {} };

/* ------------------------------------------------------------------ input */
function onKey(k) {
  if (isHang()) { if (W.ready && HG() && !$('dlg').open) hangKey(k); return; }
  const g = G();
  if (!W.ready || !g || busy || $('dlg').open) return;
  if (g.done) { if (k === 'enter') newGame(); return; }
  if (k === 'enter') return submit();
  if (k === 'left') { cur = Math.max(0, cur - 1); paintTyping(); return; }
  if (k === 'right') { cur = Math.min(g.len - 1, cur + 1); paintTyping(); return; }
  if (k === 'back') {
    // Clear the selected square if it has a letter, otherwise step back and clear.
    if (cur < g.len && slots[cur]) slots[cur] = '';
    else if (cur > 0) { cur--; slots[cur] = ''; }
    paintTyping(); return;
  }
  if (/^[a-z]$/.test(k) && cur < g.len) {
    if (!filled() && !g.guesses.length) resumeAt = Date.now();
    slots[cur] = k;
    // Move to the next empty square after this one, then any empty square, else past the end.
    let next = -1;
    for (let i = cur + 1; i < g.len; i++) if (!slots[i]) { next = i; break; }
    if (next < 0) for (let i = 0; i < g.len; i++) if (!slots[i]) { next = i; break; }
    cur = next < 0 ? g.len : next;
    paintTyping(); buzz(8);
  }
}
function selectSquare(i) {
  const g = G();
  if (!W.ready || !g || g.done || busy) return;
  cur = i; paintTyping(); buzz(5);
}
$('board').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  const g = G();
  if (!t || !g || g.done || t.parentElement !== $('board').children[g.guesses.length]) return;
  selectSquare([...t.parentElement.children].indexOf(t));
});
function shakeRow(msg) {
  const row = $('board').children[G().guesses.length];
  row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
  toast(msg); buzz([30, 40, 30]);
}
function submit() {
  const g = G();
  if (filled() < g.len) return shakeRow('Not enough letters');
  const typed = slots.join('');
  if (!W.valid[g.len].has(typed)) return shakeRow('Not in our word list');
  if (g.guesses.includes(typed)) return shakeRow('You already tried that');
  if (g.hard) { const prob = hardModeProblem(typed, g); if (prob) return shakeRow(prob); }
  bankTime();
  const guess = typed; resetTyped();
  g.guesses.push(guess);
  const marks = score(guess, g.word);
  const r = g.guesses.length - 1;
  busy = true;
  $('board').children[r].classList.remove('current');
  paintRow(r, guess, marks, true);
  const won = guess === g.word, lost = !won && g.guesses.length >= MAX_ROWS;
  if (won || lost) finish(won);
  save();
  setTimeout(() => {
    busy = false;
    renderKeyboard();
    if (won) {
      [...$('board').children[r].children].forEach((t, i) => { t.classList.remove('flip'); t.style.animationDelay = (i * 90) + 'ms'; t.classList.add('dance'); });
      toast(WIN_MSG[r], 1800); buzz([20, 60, 20, 60, 40]);
      setTimeout(openResult, 1700);
    } else if (lost) {
      toast(g.word.toUpperCase(), 2600);
      setTimeout(openResult, 1700);
    } else paintTyping();
    renderActions();
  }, g.len * 260 + 300);
}
function finish(won) {
  const g = G(), p = P();
  g.done = true; g.won = won;
  const s = statsFor(p, g.len);
  s.played++; s.hints += g.hints;
  if (won) {
    s.won++; s.streak++; s.best = Math.max(s.best, s.streak);
    s.dist[g.guesses.length - 1]++; s.totalGuesses += g.guesses.length;
    if (!g.hints && (!s.bestTime || g.elapsed < s.bestTime)) s.bestTime = g.elapsed;
  } else s.streak = 0;
  p.history.unshift({ w: g.word, won, n: g.guesses.length, t: g.elapsed, h: g.hints, lv: g.challenge ? 'challenge' : g.level, hard: g.hard, d: Date.now(), grid: g.guesses.map(x => score(x, g.word).map(m => m[0]).join('')) });
  p.history.length = Math.min(p.history.length, 60);
}

document.addEventListener('keydown', e => {

  if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;

});

/* meaning lookup (online only) */
const defCache = {};
async function fetchMeaning(word) {
  if (defCache[word]) return defCache[word];
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
  const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + word, { signal: ctl.signal });
  if (!r.ok) throw new Error('not found');
  const data = await r.json();
  const out = [];
  for (const e of data) for (const m of e.meanings || []) {
    const defs = (m.definitions || []).slice(0, 2).map(d => d.definition);
    if (defs.length && out.length < 3) out.push({ pos: m.partOfSpeech, defs });
  }
  if (!out.length) throw new Error('empty');
  return (defCache[word] = out);
}
const lookupLink = w => `<a href="https://en.wiktionary.org/wiki/${w}" target="_blank" rel="noopener">Look up ${w.toUpperCase()}</a>`;
function meaningInto(el, word) {
  el.innerHTML = '<span class="muted">Looking up the meaning…</span>';
  fetchMeaning(word).then(list => {
    el.innerHTML = list.map(m => `<div><span class="pos">${esc(m.pos)}</span><ol>${m.defs.map(d => `<li>${esc(d)}</li>`).join('')}</ol></div>`).join('') + `<div class="small" style="margin-top:6px">${lookupLink(word)}</div>`;
  }).catch(() => { el.innerHTML = `<span class="muted">Couldn't load a meaning right now.</span> ${lookupLink(word)}`; });
}
function openMeaning(word, back) {
  openDialog(word.toUpperCase(), `<div class="meaning" id="mBox"></div>${back ? '<button class="btn" id="mBack">Back</button>' : ''}`, { after: b => {
    meaningInto(b.querySelector('#mBox'), word);
    const bb = b.querySelector('#mBack'); if (bb) bb.onclick = back;
  } });
}

/* hints */
function openHints() {
  const g = G();
  const st = keyStates();
  const unknownPos = [...Array(g.len).keys()].filter(i => !g.reveal[i] && !g.guesses.some(x => x[i] === g.word[i]));
  const wrong = [...A].filter(c => !g.word.includes(c) && !st[c]);
  openDialog('Need a hint?', `
    <p class="small muted">Hints are counted in your results, so everyone knows who went it alone.</p>
    <div class="hint-opts">
      <button class="btn" id="hLetter" ${unknownPos.length > 1 ? '' : 'disabled'}>${ICON.bulb}<span>Show one letter<small>Reveals a letter in its correct spot above the board.</small></span></button>
      <button class="btn" id="hRule" ${wrong.length ? '' : 'disabled'}>${ICON.bulb}<span>Rule out 4 letters<small>Greys out 4 keyboard letters that aren't in the word.</small></span></button>
      <button class="btn" id="hClue" ${g.clue ? 'disabled' : ''}>${ICON.bulb}<span>Give me a clue<small>Shows what the word means, with the word hidden. Needs internet.</small></span></button>
    </div>
    <div id="hClueBox"></div>
  `, { after: b => {
    const use = () => { g.hints++; save(); renderActions(); };
    b.querySelector('#hLetter').onclick = () => {
      const i = unknownPos[randInt(unknownPos.length)];
      g.reveal[i] = g.word[i]; use(); renderHints(); sizeBoard(); closeDialog();
    };
    b.querySelector('#hRule').onclick = () => {
      for (let n = 0; n < 4 && wrong.length; n++) g.ruled.push(wrong.splice(randInt(wrong.length), 1)[0]);
      use(); renderKeyboard(); closeDialog();
    };
    b.querySelector('#hClue').onclick = async e => {
      const box = b.querySelector('#hClueBox');
      e.currentTarget.disabled = true;
      box.innerHTML = '<div class="clue muted">Finding a clue…</div>';
      try {
        const list = await fetchMeaning(g.word);
        const re = new RegExp(g.word.slice(0, Math.max(3, g.len - 2)) + '\\w*', 'gi');
        const m = list[0];
        box.innerHTML = `<div class="clue"><span class="pos">${esc(m.pos)}</span> ${esc(m.defs[0]).replace(re, '_____')}</div>`;

// The drawing has 11 parts. With fewer lives, the first parts (the gallows) are drawn from the start.
const HANG_PARTS = ['base', 'post', 'beam', 'brace', 'rope', 'head', 'body', 'armL', 'armR', 'legL', 'legR'];
const LIVES = [6, 8, 10];
const LIVES_LABEL = { 6: '6 · Classic', 8: '8', 10: '10 · Easy' };
const LIVES_DESC = {
  6: 'The gallows is already up. Head, body, arms and legs.',
  8: 'The rope and frame are drawn first, then the figure.',
  10: 'The whole gallows is built first. Great for kids.'
};
const HANG_WIN = ['Flawless!', 'Brilliant!', 'Superb!', 'Nicely done!', 'Got it!'];
const newHangStats = () => ({ played: 0, won: 0, streak: 0, best: 0, misses: 0, perfect: 0, bestTime: 0, hints: 0 });
function HP(p = P()) {
  return (p.hang ||= { prefs: { lives: 8, length: 0 }, stats: newHangStats(), game: null });
}
function isHang() { return P().mode === 'hangman'; }
function HG() { return HP().game; }
function curGame() { return isHang() ? HG() : G(); }
function hangWrong(g) { return g.guessed.filter(c => !g.word.includes(c)).length; }
function hangSolved(g) { return [...g.word].every(c => g.guessed.includes(c)); }

function ensureGame() {
  if (isHang()) { if (!HG()) return newHangGame(); }
  else if (!G()) return newGame();
  render();
}
function setMode(mode) {
  if ((mode === 'hangman') === isHang()) return;
  bankTime();
  P().mode = mode;
  resetTyped();
  resumeAt = Date.now();
  save();
  ensureGame();
}
function newHangGame({ word = null, challenge = false } = {}) {
  const p = P(), h = HP(p);
  const len = word ? word.length : (h.prefs.length || LENGTHS[randInt(LENGTHS.length)]);
  h.game = {
    word: word || pickWord(p, len, p.prefs.level),
    len, lives: h.prefs.lives, level: p.prefs.level, challenge,
    guessed: [], hinted: [], clue: false, hints: 0,
    elapsed: 0, done: false, won: false, started: Date.now()
  };
  save();
  render();
}
function sizeHang() {
  const g = HG(); if (!g) return;
  const w = Math.min($('stage').clientWidth - 16, 460);
  const slot = Math.max(20, Math.min(46, Math.floor((w - 6 * (g.len - 1)) / g.len)));
  $('hangWord').style.setProperty('--slot', slot + 'px');
}
function renderHang(fresh = false) {
  const g = HG(); if (!g) return;
  const wrong = hangWrong(g);
  const pre = HANG_PARTS.length - g.lives;
  const shown = pre + Math.min(wrong, g.lives);
  const svg = $('hangSvg');
  HANG_PARTS.forEach((name, i) => {
    const el = svg.querySelector(`[data-part="${name}"]`);
    el.classList.toggle('on', i < shown);
    el.classList.toggle('fresh', fresh && i === shown - 1);
  });
  const headShown = shown > HANG_PARTS.indexOf('head');
  svg.classList.toggle('lost', g.done && !g.won);
  svg.classList.toggle('won', g.done && g.won);
  // SVG elements have no .hidden property, so toggle the attribute directly.
  $('faceLost').toggleAttribute('hidden', !(g.done && !g.won));
  $('faceWon').toggleAttribute('hidden', !(g.done && g.won && headShown));
  svg.setAttribute('aria-label', `Hangman drawing: ${wrong} of ${g.lives} mistakes used`);

  const left = g.lives - wrong;
  $('hangInfo').innerHTML = g.done
    ? (g.won ? `Saved with ${left} ${left === 1 ? 'life' : 'lives'} to spare` : 'Out of lives')
    : `<span class="lives" aria-hidden="true">${Array.from({ length: g.lives }, (_, i) => `<i class="${i < left ? '' : 'gone'}"></i>`).join('')}</span>${left} ${left === 1 ? 'mistake' : 'mistakes'} left`;
  $('hangWord').innerHTML = [...g.word].map(c => {
    const got = g.guessed.includes(c);
    const cls = got ? (g.hinted.includes(c) ? 'slot got hinted' : 'slot got') : g.done ? 'slot missed' : 'slot';
    return `<div class="${cls}">${got || g.done ? c : ''}</div>`;
  }).join('');
  $('hangWord').setAttribute('aria-label', 'Word: ' + [...g.word].map(c => g.guessed.includes(c) || g.done ? c.toUpperCase() : 'blank').join(', '));
  const misses = g.guessed.filter(c => !g.word.includes(c));
  $('hangWrong').innerHTML = misses.length ? `<span>Wrong:</span>${misses.join(' ')}` : '&nbsp;';
  sizeHang();
}
function renderHangActions() {

function hangKey(k) {
  const g = HG();
  if (g.done) { if (k === 'enter') newHangGame(); return; }
  if (!/^[a-z]$/.test(k)) return;
  if (g.guessed.includes(k)) { toast(`You already tried ${k.toUpperCase()}`); return; }
  if (!g.guessed.length) resumeAt = Date.now();
  bankTime();
  g.guessed.push(k);
  const hit = g.word.includes(k);
  if (hit) buzz(10);
  else {
    buzz([30, 40, 30]);
    const svg = $('hangSvg');
    svg.classList.remove('shake'); void svg.getBoundingClientRect(); svg.classList.add('shake');
  }
  if (hangSolved(g)) hangFinish(true);
  else if (hangWrong(g) >= g.lives) hangFinish(false);
  save();
  renderHang(!hit); renderKeyboard(); renderActions(); renderMeta();
  if (g.done) {
    if (g.won) toast(HANG_WIN[Math.min(hangWrong(g), HANG_WIN.length - 1)], 1600);
    else toast(g.word.toUpperCase(), 2400);
    setTimeout(() => { if (HG() === g && !$('dlg').open) openHangResult(); }, 1400);
  }
}
function hangFinish(won) {
  const g = HG(), p = P(), s = HP(p).stats;
  g.done = true; g.won = won;
  const wrong = hangWrong(g);
  s.played++; s.hints += g.hints;
  if (won) {
    s.won++; s.streak++; s.best = Math.max(s.best, s.streak); s.misses += wrong;
    if (!wrong) s.perfect++;
    if (!g.hints && (!s.bestTime || g.elapsed < s.bestTime)) s.bestTime = g.elapsed;
  } else s.streak = 0;
  p.history.unshift({ m: 'hang', w: g.word, won, miss: wrong, lives: g.lives, t: g.elapsed, h: g.hints, lv: g.challenge ? 'challenge' : g.level, d: Date.now() });
  p.history.length = Math.min(p.history.length, 60);
}

    b.querySelector('#rShare').onclick = e => shareOrCopy(hangShareText(g), e.currentTarget);
    b.querySelector('#rStats').onclick = () => openHangStats('me');
    b.querySelector('#rChal').onclick = () => showCode(g.word, true, 'hangman');
  } });
}
function openHangStats(tab = 'me') {
  const p = P();
  const tabs = `<button class="chip ${tab === 'me' ? 'primary' : ''}" data-tab="me">${esc(p.name)}</button>
    ${DB.players.length > 1 ? `<button class="chip ${tab === 'family' ? 'primary' : ''}" data-tab="family">Family</button>` : ''}
    <button class="chip ${tab === 'history' ? 'primary' : ''}" data-tab="history">Recent words</button>`;
  const avg = s => s.won ? (s.misses / s.won).toFixed(1) : '–';
  let html;
  if (tab === 'me') {
    const s = HP(p).stats;
    html = `<p class="small muted">Hangman stats. Switch to Words at the top to see those stats.</p>
      <div class="statgrid">
        <div><b>${s.played}</b><span>Played</span></div>
        <div><b>${s.played ? Math.round(100 * s.won / s.played) : 0}</b><span>Win %</span></div>
        <div><b>${s.streak}</b><span>Win streak</span></div>
        <div><b>${s.best}</b><span>Best streak</span></div>
      </div>
      <div class="statgrid">
        <div><b>${avg(s)}</b><span>Average mistakes</span></div>
        <div><b>${s.perfect}</b><span>Perfect games</span></div>
        <div><b>${s.bestTime ? fmtTime(s.bestTime) : '–'}</b><span>Fastest (no hints)</span></div>
        <div><b>${s.hints}</b><span>Hints used</span></div>
      </div>
      <p class="small muted">A perfect game means no wrong letters at all.</p>`;
  } else if (tab === 'family') {
    const rate = s => s.won / (s.played || 1);
    const rows = DB.players.map(pl => ({ pl, s: HP(pl).stats })).sort((a, b) => rate(b.s) - rate(a.s) || b.s.played - a.s.played);
    html = `<div style="overflow-x:auto"><table class="fam"><thead><tr><th>Player</th><th>Won</th><th>Win %</th><th>Avg miss</th><th>Perfect</th><th>Streak</th></tr></thead><tbody>
      ${rows.map(({ pl, s }) => `<tr><td><span class="pn"><span class="badge" style="background:var(--${pl.color})">${esc((pl.name.trim()[0] || '?').toUpperCase())}</span>${esc(pl.name)}</span></td>
        <td>${s.won}/${s.played}</td><td>${s.played ? Math.round(100 * s.won / s.played) : 0}%</td><td>${avg(s)}</td><td>${s.perfect}</td><td>${s.streak}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted">Players may use different numbers of lives. Use <b>Challenge</b> to give everyone the same word.</p>`;
  } else html = historyHtml(p);
  openDialog('Hangman statistics', html, { tabs, after: b => {
    $('dlgTabs').querySelectorAll('[data-tab]').forEach(x => x.onclick = () => openHangStats(x.dataset.tab));
    b.querySelectorAll('.hist button').forEach(x => x.onclick = () => openMeaning(p.history[+x.dataset.i].w, () => openHangStats('history')));
  } });
}

/* header wiring */
$('btnHelp').onclick = openHelp;
$('btnWho').onclick = openPlayers;
$('btnNew').onclick = () => { if (W.ready) requestNew(); };
$('btnStats').onclick = () => { if (curGame()) openStats(); };
$('modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b && W.ready) setMode(b.dataset.mode); });
$('btnSettings').onclick = openSettings;
window.addEventListener('resize', sizeBoard);
if (window.visualViewport) visualViewport.addEventListener('resize', sizeBoard);

/* install prompt (Android Chrome) */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });

/* ------------------------------------------------------------------ boot */
async function start() {
  applyTheme();
  renderWho();
  try { await loadWords(); }
  catch { $('loading').textContent = "Couldn't load the word list. Check your connection and reload."; return; }
  $('loading').remove();
  if (P().game && P().game.word && !W.valid[P().game.len]?.has(P().game.word)) P().game = null;
  ensureGame();
  resumeAt = Date.now();
  if (/^#(play|hang)-/.test(location.hash)) checkHash();
  else if (!DB.seenHelp) openHelp();
}
window.claude?.hot?.snapshot?.(() => ({}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// expose pure logic for tests
window.__guesswork = { score, hardModeProblem, encodeWord, decodeWord, hangWrong, hangSolved };
})();
</script>
